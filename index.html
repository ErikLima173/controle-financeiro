<div id="app" class="app" aria-busy="true">
  <aside class="trilho" aria-label="Navegação principal">
    <div class="marca">
      <span class="marca-icone"><svg class="ico" aria-hidden="true"><use href="#i-livro"/></svg></span>
      <span class="marca-textos"><span class="marca-nome">Livro-Caixa</span><span class="marca-sub">controle financeiro</span></span>
    </div>
    <nav class="nav" aria-label="Seções">
      <button type="button" class="nav-item" data-vista="painel"><svg class="ico" aria-hidden="true"><use href="#i-painel"/></svg><span class="nav-rotulo">Painel</span></button>
      <button type="button" class="nav-item" data-vista="mensal"><svg class="ico" aria-hidden="true"><use href="#i-mensal"/></svg><span class="nav-rotulo">Mensal</span></button>
      <button type="button" class="nav-item" data-vista="lancamentos"><svg class="ico" aria-hidden="true"><use href="#i-lancamentos"/></svg><span class="nav-rotulo">Lançamentos</span></button>
      <button type="button" class="nav-item" data-vista="orcamento"><svg class="ico" aria-hidden="true"><use href="#i-orcamento"/></svg><span class="nav-rotulo">Orçamento</span></button>
      <button type="button" class="nav-item" data-vista="cadastros"><svg class="ico" aria-hidden="true"><use href="#i-cadastros"/></svg><span class="nav-rotulo">Cadastros</span></button>
    </nav>
    <div class="trilho-rodape">
      <div id="status-salvamento" class="status-salvamento" role="status"></div>
      <button type="button" id="acao-tema" class="nav-item nav-discreto" hidden></button>
    </div>
  </aside>

  <main class="principal" id="principal">
    <header class="topo">
      <div class="topo-linha">
        <div class="topo-titulos">
          <h1 id="titulo-vista" class="topo-titulo">Painel</h1>
          <p id="subtitulo-vista" class="topo-sub"></p>
        </div>
        <div class="topo-acoes">
          <button type="button" id="acao-importar" class="botao"><svg class="ico" aria-hidden="true"><use href="#i-importar"/></svg><span>Importar</span></button>
          <button type="button" id="acao-exportar" class="botao" aria-haspopup="menu" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-exportar"/></svg><span>Exportar</span></button>
          <button type="button" id="acao-novo" class="botao botao-primario" title="Novo lançamento (atalho: N)"><svg class="ico" aria-hidden="true"><use href="#i-adicionar"/></svg><span>Lançamento</span></button>
        </div>
      </div>
      <div id="filtros" class="filtros" role="group" aria-label="Filtros do painel e da planilha"></div>
    </header>

    <div id="faixa" class="faixas"></div>

    <div id="carregando" class="carregando">
      <svg class="ico ico-grande" aria-hidden="true"><use href="#i-livro"/></svg>
      <strong>Abrindo o livro-caixa…</strong>
      <span>Os lançamentos, os gráficos do painel e o orçamento aparecem aqui em instantes.</span>
    </div>

    <section id="vista-painel" class="vista" aria-label="Painel" hidden>
      <div id="painel-topo" class="painel-topo"></div>
      <div class="secao-cabeca">
        <div>
          <h2 class="secao-titulo">Gráficos</h2>
          <p class="secao-sub">Clique no lápis para mudar tipo, dados e cores. Arraste pela alça para mudar a ordem.</p>
        </div>
      </div>
      <div id="painel-graficos" class="painel-graficos"></div>
    </section>
    <section id="vista-mensal" class="vista vista-mensal" aria-label="Planilha mensal" hidden></section>
    <section id="vista-lancamentos" class="vista" aria-label="Lançamentos" hidden></section>
    <section id="vista-orcamento" class="vista vista-orcamento" aria-label="Orçamento" hidden></section>
    <section id="vista-cadastros" class="vista vista-cadastros" aria-label="Cadastros" hidden></section>
  </main>
</div>

<div id="avisos" class="avisos"></div>
